[project]
name = "meshroom-webapp"
dynamic = ["version"]
description = "Web application for Meshroom 3D reconstruction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Simone Gasparini", email = "simone.gasparini@gmail.com"}
]
dependencies = [
    "fastapi==0.140.13",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "websockets==16.1.1",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "websocket-client==1.9.0",
]

[project.optional-dependencies]
test = [
    # Testing framework
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    # Code quality - linting and formatting (replaces flake8, black, isort)
    "ruff==0.16.0",
    # Type checking
    "mypy==2.1.0",
    "types-requests==2.33.0.20260712",
    # Security scanning
    "bandit[toml]==1.9.4",
    "safety==3.8.1",
    # Documentation
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff configuration - replaces flake8, black, and isort
[tool.ruff]
line-length = 88
target-version = "py312"

# Exclude directories from linting and formatting
exclude = [
    "__pycache__",
    ".git",
    ".tox",
    ".eggs",
    ".venv",
    "venv",
    "build",
    "dist",
    "downloads",
    "models",
    "uploads",
    "reports",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
# Enable pycodestyle (E, W), pyflakes (F), isort (I), and other common rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
]

# Ignore specific rules that conflict with Black or are too strict
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP035",  # typing.Dict -> dict (Python 3.9+, will migrate separately)
    "B008",  # Function call in argument defaults (FastAPI pattern)
    "B904",  # Exception chaining with `from` (will improve separately)
    "D203",  # 1 blank line required before class docstring (conflicts with D211/Google style)
    "D213",  # Multi-line docstring summary should start at second line (conflicts with D212/Google style)
    "D406",  # Section name should end with a newline (NumPy style, not Google)
    "D407",  # Missing dashed underline after section (NumPy style, not Google)
    "D408",  # Section underline should be in line with section name (NumPy style, not Google)
    "D409",  # Section underline should match length of section name (NumPy style, not Google)
]

# Per-file ignores (matching previous flake8 config)
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F811"]  # Allow long lines, redefinitions in tests

# Isort configuration (import sorting)
[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "downloads", "models", "uploads", "reports", ".venv", "venv"]
skips = ["B311", "B324"]  # Skip random and hashlib warnings for test/demo code
tests = []

[tool.bandit.assert_used]
skips = ["*_test.py", "*/tests/*"]

[tool.bandit.hardcoded_password_string]
word_list = ["example", "sample", "demo", "test", "fake", "placeholder"]

[tool.bandit.hardcoded_password_funcarg]
word_list = ["example", "sample", "demo", "test", "fake", "placeholder"]

[tool.bandit.hardcoded_password_default]
word_list = ["example", "sample", "demo", "test", "fake", "placeholder"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["models", "jobs"]
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
